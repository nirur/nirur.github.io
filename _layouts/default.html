<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script>
            window.MathJax = {
                'tex': {inlineMath: {'[+]': [['$', '$']]}}
            };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
        <title>{{ page.title }} | nirur</title>
        <link rel="stylesheet" href="/static/css/default.css">
        <link rel="icon" type="image/png" href="/static/icon/fav.png">
        <link rel="license" href="/LICENSE.md">
        <script>
            window.onload = (() => {
                var main = document.querySelector("nav.navy#hd");
                var i = 1;
                for (var sec of document.querySelectorAll(
                    "#content > h1, #content > h2, #content > header"
                )) {
                    var setid = "sect"+i;
                    sec.id = setid;
                    var link = document.createElement("a");
                    link.href = "#"+setid;
                    if (sec.nodeName == 'HEADER')
                        link.textContent = 'Top';
                    else
                        link.textContent = sec.textContent;
                    link.classList = "hide blanklk";
                    main.appendChild(link);
                    i++;
                }
                if (i>2)
                    main.hidden = false;
            });
        </script>
        <script>
            function flip() {
                document.querySelectorAll(".navy > *:not(.hamb)")
                    .forEach(v => v.classList.toggle('hide'));
            }
        </script>
    </head>
    <body style="display: flex">
        <nav class="navy blanklk" id="mn">
            <span class="hamb" onclick="flip()">&#x2630;</span>
            <a href="/" id="tlico">
                    <style>
                        #tlico {
                            width: 10em;
                            height: 10em;
                            display: block;
                            padding: 0;
                            background-image: url('/static/icon/dark.png');
                            background-size: 10em;
                        }
                        #tlico:hover {
                            background-image: url('/static/icon/light.png');
                        }
                    </style>
            </a>
            <a href="/blog">Writing</a>
            <a href="/pictures">Pictures</a>
            <a href="/news">News</a>
        </nav>
        <script>
            for (var e of document.querySelectorAll("#mn > a"))
                e.classList.add('hide');
        </script>
        <nav class="navy" id="hd" hidden>
            <span class="hide">JUMP</span>
        </nav>
        <div id="main" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column;">
            <div id="content">
                {% if page.title %}
                <header>
                    <h1>
                        {{ page.title }}
                    </h1>
                </header>
                {% endif %}
                {{ content }}
            </div>
            <footer style="flex: 1;">
                Contact: niranjanrao049[at]gmail[dot]com. I represent
                my own opinions only.
                <a href="https://github.com/nirur/nirur.github.io"> GitHub
                repo</a> for this website.
            </footer>
            <script>
                MathJax.typesetPromise(['.mjx']);
            </script>
        </div>
    </body>
</html>
